name: Collect DSE market cap

on:
  schedule:
    # 09:30 UTC Sun-Thu = 15:30 Dhaka (DSE closes 14:00)
    - cron: '30 9 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch market cap
        run: python dse_cap.py
      - name: Commit CSV
        run: |
          git config user.name "dse-bot"
          git config user.email "dse-bot@users.noreply.github.com"
          git add dse_market_cap.csv
          git diff --staged --quiet || git commit -m "Update DSE market cap $(date -u +%F)"
          git push
